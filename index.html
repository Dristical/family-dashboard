<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Shared Dashboard & Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="login-container">
        <div class="login-card">
            <h2>Family Hub Login</h2>
            <p>Select your profile and enter your password</p>
            <select id="login-user">
                <option value="Jeyad">Jeyad (Admin)</option>
                <option value="Hany">Hany (Member)</option>
                <option value="Mila">Mila (Member)</option>
                <option value="Maya">Maya (Member)</option>
            </select>
            <input type="password" id="login-pass" placeholder="Password (matches username)">
            <button id="login-btn" class="btn-primary">Log In</button>
            <p id="login-error" class="error-msg"></p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-app" class="dashboard-hidden">
        <header class="app-header">
            <div class="header-left">
                <h1>🏠 Kuwait Family Hub</h1>
                <span id="live-clock"></span>
            </div>
            <div class="header-right">
                <span id="user-badge"></span>
                <button id="theme-toggle" class="btn-secondary">🌙 Mode</button>
                <button id="logout-btn" class="btn-danger">Log Out</button>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Left Column -->
            <div class="column">
                <section class="card">
                    <h3>📌 Announcements & Family Board</h3>
                    <div id="announcements-list" class="scroll-box"></div>
                    <div class="input-group">
                        <input type="text" id="new-announcement" placeholder="Add an announcement...">
                        <button onclick="addAnnouncement()" class="btn-primary">Post</button>
                    </div>
                </section>

                <section class="card">
                    <h3>🧹 Family Chore Tracker</h3>
                    <div id="chores-list"></div>
                    <div class="input-group">
                        <input type="text" id="new-chore" placeholder="New chore...">
                        <select id="chore-assigned">
                            <option value="Jeyad">Jeyad</option>
                            <option value="Hany">Hany</option>
                            <option value="Mila">Mila</option>
                            <option value="Maya">Maya</option>
                        </select>
                        <button onclick="addChore()" class="btn-primary">Add</button>
                    </div>
                </section>
            </div>

            <!-- Right Column -->
            <div class="column">
                <section class="card">
                    <h3>📅 Personal & Family Schedule</h3>
                    <div id="schedule-list" class="scroll-box"></div>
                    <div class="input-group">
                        <input type="text" id="schedule-task" placeholder="Task / Schedule item...">
                        <button onclick="addScheduleItem()" class="btn-primary">Add to Schedule</button>
                    </div>
                </section>

                <section class="card">
                    <h3>📋 Family Shared Tasks</h3>
                    <div id="family-tasks-list"></div>
                    <div class="input-group">
                        <input type="text" id="new-family-task" placeholder="Add shared task...">
                        <button onclick="addFamilyTask()" class="btn-primary">Add Task</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
